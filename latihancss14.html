<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Transition & Animation Dasar</title>
  <style>
    .button {
      background-color: royalblue;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: crimson;
    }
    .button:hover::after {
      content: " Rex Orange County adalah nama panggung Alexander James O'Connor, penyanyi dan penulis lagu asal Inggris yang lahir pada 4 Mei 1998. Ia mulai membuat musik sejak remaja dan dikenal melalui album pertamanya, Bcos U Will Never Be Free, serta kolaborasinya dengan Tyler, the Creator.  Kariernya terus berkembang melalui album seperti Apricot Princess, Pony, Who Cares?, dan The Alexander Technique. Musiknya memadukan berbagai genre, termasuk indie pop, jazz, hip-hop, dan lo-fi, yang membuatnya dikenal oleh pendengar di berbagai negara.";
    }

    .box {
      width: 100px;
      height: 100px;
      background-color: teal;
      margin-top: 40px;
      animation: goyang 1s ease-in-out infinite alternate;
    }

    @keyframes goyang {
      0% {
        transform: rotate(-10deg);
      }
      100% {
        transform: rotate(5deg);
      }
    }
  </style>
</head>
<body>

  <h1>Contoh Transition & Animation</h1>

  <button class="button">mau tau enggak? </button>

  <div class="box"></div>
  <a href="latihancss15.html">latihan selanjutnya</a>

</body>
</html>
